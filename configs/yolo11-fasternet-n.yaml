# yolo11-fasternet-n.yaml —— M3 v2：FasterNet 轻量化主干
# v2 修正：P2 高分辨率层保留原版 C3k2（该层替换 FLOPs 倒挂且可吃预训练），
#           仅 P3/P4/P5 三层换 "1×1 适配 + FasterBlock×2"（expand=1）
# 通道说明：Conv args 被 width 缩放（n=0.25），FasterBlock 不缩放填实际通道数
# 注意：需在 Python 侧注册 FasterBlock（见 autodl/m3_train.py）
nc: 10
scales:
  n: [0.50, 0.25, 1024]
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0 →16
  - [-1, 1, Conv, [128, 3, 2]]         # 1 →32
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2 (P2，保留原版)
  - [-1, 1, Conv, [256, 3, 2]]         # 3 →64
  - [-1, 1, Conv, [512, 1, 1]]         # 4 适配 →128
  - [-1, 2, FasterBlock, [128]]        # 5 (P3 特征)
  - [-1, 1, Conv, [512, 3, 2]]         # 6 →128
  - [-1, 1, Conv, [512, 1, 1]]         # 7 适配 →128
  - [-1, 2, FasterBlock, [128]]        # 8 (P4 特征)
  - [-1, 1, Conv, [1024, 3, 2]]        # 9 →256
  - [-1, 1, Conv, [1024, 1, 1]]        # 10 适配 →256
  - [-1, 2, FasterBlock, [256]]        # 11 (P5 特征)
  - [-1, 1, SPPF, [1024, 5]]           # 12 →256
  - [-1, 2, C2PSA, [1024]]             # 13 →256
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 8], 1, Concat, [1]]                  # 15 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                # 16 →128
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 5], 1, Concat, [1]]                  # 18 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                # 19 →64 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                 # 20 →64
  - [[-1, 16], 1, Concat, [1]]                 # 21
  - [-1, 2, C3k2, [512, False]]                # 22 →128 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                 # 23 →128
  - [[-1, 13], 1, Concat, [1]]                 # 24 cat head P5
  - [-1, 2, C3k2, [1024, True]]                # 25 →256 (P5/32)
  - [[19, 22, 25], 1, Detect, [nc]]            # 26
