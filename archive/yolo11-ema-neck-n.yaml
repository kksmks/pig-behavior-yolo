# yolo11-ema-neck-n.yaml —— M1' 修正版：EMA 插入颈部 P3 输出后
# 修正 1：位置从主干末端（C2PSA 后，与自注意力堆叠）挪到颈部 P3（小目标检测分支），
#         针对 eat/drink 槽区小目标与姿态混淆
# 修正 2：插入点之前层号不变，预训练权重仅 EMA 本身缺失，配合权重重映射吃满初始化
# 注意：需先在 Python 侧注册 EMA 类（见 notebooks/colab_m1p_ema_neck.ipynb）
nc: 10
scales:
  n: [0.50, 0.25, 1024]
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0
  - [-1, 1, Conv, [128, 3, 2]]        # 1
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5
  - [-1, 2, C3k2, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7
  - [-1, 2, C3k2, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9
  - [-1, 2, C2PSA, [1024]]            # 10
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 2, C3k2, [512, False]]                # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15
  - [-1, 2, C3k2, [256, False]]                # 16 (P3/8)
  - [-1, 1, EMA, [64]]                         # 17 ← 插入（P3 实际 64 通道）
  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 13], 1, Concat, [1]]                 # 19
  - [-1, 2, C3k2, [512, False]]                # 20 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 10], 1, Concat, [1]]                 # 22
  - [-1, 2, C3k2, [1024, True]]                # 23 (P5/32)
  - [[17, 20, 23], 1, Detect, [nc]]            # 24 ← P3 取 EMA 输出
