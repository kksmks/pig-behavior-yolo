# yolo11-emar-n.yaml —— M2：残差封装的 EMA（EMAR）插于颈部 P3
# 教训来源：M1/M1' 两轮失败根因是随机初始化的乘法门控污染预训练特征；
#           残差形式 y = x + EMA(x) 使初始状态等价于原网络，注意力只作增量学习
# 注意：需在 Python 侧注册 EMAR 类（见 notebooks/colab_m2_emar.ipynb）
nc: 10
scales:
  n: [0.50, 0.25, 1024]
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0
  - [-1, 1, Conv, [128, 3, 2]]        # 1
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5
  - [-1, 2, C3k2, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7
  - [-1, 2, C3k2, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9
  - [-1, 2, C2PSA, [1024]]            # 10
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 2, C3k2, [512, False]]                # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15
  - [-1, 2, C3k2, [256, False]]                # 16 (P3/8)
  - [-1, 1, EMAR, [64]]                        # 17 ← 残差 EMA（P3 实际 64 通道）
  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 13], 1, Concat, [1]]                 # 19
  - [-1, 2, C3k2, [512, False]]                # 20 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 10], 1, Concat, [1]]                 # 22
  - [-1, 2, C3k2, [1024, True]]                # 23 (P5/32)
  - [[17, 20, 23], 1, Detect, [nc]]            # 24
